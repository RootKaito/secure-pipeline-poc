name: Pre-deploy DAST

# Disparo manual, não a cada push: um scan DAST contra o mesmo alvo fixo não muda
# de resultado a cada commit (o Juice Shop tem os mesmos achados sempre), então
# rodar automaticamente em toda push deixaria o repositório permanentemente "vermelho"
# no Actions. Na prática, um DAST roda sob demanda ou antes de um deploy real — aqui
# ele demonstra o gate 3 quando você quiser gerar a evidência, não como CI contínuo.
on:
  workflow_dispatch:

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Juice Shop (staging surrogate)
        run: docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop

      - name: Wait for Juice Shop to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Juice Shop is up"
              exit 0
            fi
            echo "Waiting for Juice Shop..."
            sleep 2
          done
          echo "Juice Shop did not start in time"
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: 'zap/zap-baseline-rules.conf'
          fail_action: true
